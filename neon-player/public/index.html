<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0838">
  <title>Neon Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- background: drop a "bg.jpg" into /public to use your own picture instead -->
  <div class="bg" aria-hidden="true">
    <div class="neon-left"></div>
    <div class="neon-right"></div>
    <div class="floor"></div>
  </div>
  <canvas id="rain" aria-hidden="true"></canvas>

  <button id="menuBtn" class="menu-btn" type="button" aria-label="Open playlist" aria-expanded="false" aria-controls="drawer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer" aria-label="Playlist" inert>
    <header>
      <h2>Library</h2>
      <button id="refreshBtn" class="icon-btn small" type="button" aria-label="Rescan music folder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button id="closeBtn" class="icon-btn small" type="button" aria-label="Close playlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <input id="search" type="search" placeholder="Search songs" autocomplete="off">
    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>No songs yet.<br>Put audio files in the <b>music</b> folder, then tap rescan.</p>
  </aside>

  <main class="player">
    <div class="art">
      <img id="cover" alt="Album cover" hidden>
      <div id="artFallback" class="art-fallback" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
    </div>

    <section class="panel">
      <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">

      <div class="controls">
        <button id="shuffle" class="icon-btn" type="button" aria-label="Shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button id="prev" class="icon-btn big" type="button" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button id="play" class="play" type="button" aria-label="Play">
          <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="7 3 20 12 7 21 7 3"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="4" width="4.5" height="16" rx="1"/><rect x="13.5" y="4" width="4.5" height="16" rx="1"/></svg>
        </button>
        <button id="next" class="icon-btn big" type="button" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <button id="repeat" class="icon-btn" type="button" aria-label="Repeat: off" data-mode="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>

      <div id="volumeRow" class="volume">
        <button id="mute" class="icon-btn small" type="button" aria-label="Mute">
          <svg id="iconVol" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" fill="none"/></svg>
          <svg id="iconMute" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15" fill="none"/><line x1="17" y1="9" x2="23" y2="15" fill="none"/></svg>
        </button>
        <input id="vol" type="range" min="0" max="100" step="1" value="70" aria-label="Volume">
      </div>

      <div class="now" aria-live="polite">
        <small>Now Playing</small>
        <h1 id="title">Loading…</h1>
      </div>
    </section>
    <audio id="audio" preload="metadata"></audio>
  </main>

  <script src="app.js"></script>
</body>
</html>
